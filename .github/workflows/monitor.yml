name: Monitor de estoque Maersk
on:
  schedule:
    # a cada 15 minutos - checagem de mudancas de estoque
    - cron: "*/15 * * * *"
    # 6x por dia (00h, 04h, 08h, 12h, 16h, 20h horario de Brasilia) - resumo diario
    - cron: "0 3,7,11,15,19,23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "O que rodar manualmente"
        required: true
        default: "checagem"
        type: choice
        options:
          - checagem
          - resumo
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Rodar checagem de estoque
        if: github.event.schedule == '*/15 * * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'checagem')
        env:
          MAERSK_EMAIL: ${{ secrets.MAERSK_EMAIL }}
          MAERSK_PASSWORD: ${{ secrets.MAERSK_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py
      - name: Rodar resumo diário
        if: github.event.schedule == '0 3,7,11,15,19,23 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'resumo')
        env:
          MAERSK_EMAIL: ${{ secrets.MAERSK_EMAIL }}
          MAERSK_PASSWORD: ${{ secrets.MAERSK_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py --summary
      - name: Salvar snapshot atualizado no repositório
        run: |
          git config user.name "estoque-maersk-bot"
          git config user.email "actions@github.com"
          git add state/snapshot.json
          git diff --quiet --cached || git commit -m "Atualiza snapshot de estoque [skip ci]"
          git push
